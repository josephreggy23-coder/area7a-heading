[project]
name = "area7a-heading"
version = "0.1.0"
description = "Visuo-vestibular heading discrimination in macaque area 7a"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "h5py>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
# Lets `python -m pytest analysis/tests` work from the repository root without
# installing the package or setting PYTHONPATH by hand.
pythonpath = ["analysis"]
testpaths = ["analysis/tests"]
